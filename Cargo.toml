[workspace]
resolver = "2"
members = ["crates/subforge-core", "crates/subforge-cli", "crates/subforge-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
subforge-core = { path = "crates/subforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
